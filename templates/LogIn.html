{% extends "base.html" %}

{% block title %}Login - FluffyTails{% endblock %}

{% block head %} 
    <style>
        body {
            background: linear-gradient(135deg, #2b063c, #7a2b91);
            color: white;
            min-height: 100vh;
        }
        .login-card {
            max-width: 450px;
            margin: 140px auto 50px auto;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        .login-card h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
        }
        .login-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px auto;
            display: block;
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .login-card .form-label {
            text-align: left;
            display: block;
            font-weight: 600;
            color: #f3e6f7;
            margin-bottom: 6px;
        }
        .login-card .form-control {
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
        }
        .login-card .btn-submit {
            background-color: #e5c0d1;
            color: #540c55;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 30px;
            padding: 12px;
            width: 100%;
            border: none;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .login-card .btn-submit:hover {
            background-color: #ffffff;
            color: #3e043b;
            transform: translateY(-2px);
        }
        .login-card p {
            color: #f3e6f7;
            margin-top: 20px;
        }
        .login-card a {
            color: #ffd1dc;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
{% endblock %}

{% block main_block %}
<div class="login-card">
    <img src="{{ url_for('static', filename='image.png') }}" alt="FluffyTails Logo" class="login-logo">
    <h2>Login</h2>
    <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3 text-start">
            <label for="username" class="form-label">Email Address:</label>
            <input type="email" name="email" id="username" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="mb-3 text-start">
            <label for="password" class="form-label">Password:</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <div class="mb-3 text-start">
            <label for="role" class="form-label">Role:</label>
            <select name="role" id="role" class="form-control" required>
                <option value="">Choose Role</option>
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <div class="mb-3">
            <input type="submit" class="btn btn-submit" value="Login">
        </div>
    </form>
    <p>New User? <a href="{{ url_for('signup') }}">Register here</a></p>
</div>
{% endblock %}
