{% extends "base.html" %}

{% block title %}Register - FluffyTails{% endblock %}

{% block head %}
    <style>
        body {
            background: linear-gradient(135deg, #2b063c, #7a2b91);
            color: white;
            min-height: 100vh;
        }
        .register-card {
            max-width: 500px;
            margin: 140px auto 50px auto;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        .register-card h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
        }
        .register-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px auto;
            display: block;
            border: 3px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .register-card .form-label {
            text-align: left;
            display: block;
            font-weight: 600;
            color: #f3e6f7;
            margin-bottom: 6px;
        }
        .register-card .form-control {
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
        }
        .register-card .btn-submit {
            background-color: #e5c0d1;
            color: #540c55;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 30px;
            padding: 12px;
            width: 100%;
            border: none;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .register-card .btn-submit:hover {
            background-color: #ffffff;
            color: #3e043b;
            transform: translateY(-2px);
        }
        .register-card p {
            color: #f3e6f7;
            margin-top: 20px;
        }
        .register-card a {
            color: #ffd1dc;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
{% endblock %}

{% block main_block %}
<div class="register-card">
    <img src="{{ url_for('static', filename='image.png') }}" alt="FluffyTails Logo" class="register-logo">
    <h2>Register</h2>
    <form action="{{ url_for('signup') }}" method="POST">
        <div class="mb-3 text-start">
            <label for="name" class="form-label">Full Name:</label>
            <input type="text" name="name" id="name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="mb-3 text-start">
            <label for="email" class="form-label">Email Address:</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="mb-3 text-start">
            <label for="password" class="form-label">Password:</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
        </div>

        <div class="mb-3 text-start">
            <label for="confirm_password" class="form-label">Confirm Password:</label>
            <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Confirm password" required>
        </div>

        <div class="mb-3 text-start">
            <label for="mobile" class="form-label">Mobile Number:</label>
            <input type="tel" name="mobile" id="mobile" class="form-control" placeholder="10-digit mobile number" minlength="10" maxlength="10" required>
        </div>

        <div class="mb-3">
            <input type="submit" class="btn btn-submit" value="Create Account">
        </div>
    </form>
    <p>Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
</div>
{% endblock %}
